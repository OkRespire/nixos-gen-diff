[package]
name = "nixos-gen-diff"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
ratatui = "0.30.2"
strip-ansi-escapes = "0.2.1"

[lints.rust]
warnings = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
borrow_interior_mutable_const = "deny"

[profile.release]
strip = true
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
